name: tests
on:
  push:
  pull_request:
# CI only reads the checkout; never grant the default write token.
permissions:
  contents: read
jobs:
  invariants:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]  # numpy 2.5 / shap 0.52 require >=3.12
    steps:
      - uses: actions/checkout@v4
      # Resolve through the SAME locked path the shipped images use (`uv sync --frozen`), so a green
      # CI implies a green image. The dev group carries ruff + pytest. requirements.txt (a generated
      # `uv export`) is only the pip-fallback path; CI does not exercise it.
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.9"
          enable-cache: true
      - run: uv sync --frozen --python ${{ matrix.python-version }}
      - run: uv run ruff check src scripts tests ui
      - name: invariant tests
        env:
          PROTOMETER_NO_TRACKING: "1"
          PROTOMETER_NO_TRACING: "1"
        run: uv run python -m pytest tests/ -q

  docs-in-sync:
    # Docs derive from the committed artifacts. This regenerates them and fails if
    # the committed docs are stale, catching "artifact updated, docs not regenerated". It reads
    # only JSON artifacts, no Protegrity services or hosted models are needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.9"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - name: regenerate derived docs from artifacts (only if artifacts are committed)
        env:
          PYTHON: uv run python
          PROTOMETER_NO_TRACKING: "1"
          PROTOMETER_NO_TRACING: "1"
        run: |
          # The docs derive from committed eval artifacts. On a checkout without them (they may
          # be absent on a fork or before a run is committed), skip regeneration rather than
          # fail on spurious drift, there is nothing to be stale against.
          if [ ! -f data/eval/training.json ]; then
            echo "eval artifacts not committed; skipping docs-in-sync check"
            exit 0
          fi
          make docs
          # -I: the Generated date stamp is the run date by design; a push regenerated just
          # before UTC midnight must not fail the freshness check the morning after.
          if ! git diff --quiet -I '^- \*\*Generated:' -- README.md docs/results-aml.md data/eval/key_metrics.json; then
            echo "::error::Derived docs are stale. Run 'make docs' and commit the result."
            git --no-pager diff -I '^- \*\*Generated:' -- README.md docs/results-aml.md data/eval/key_metrics.json
            exit 1
          fi
          echo "docs are in sync with the artifacts"

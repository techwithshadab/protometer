# nginx config for the BOTOX® Assistant widget container.
# Serves the static SPA and reverse-proxies /api/* to the backend service (docker-compose network).

# Per-client rate limit for the API. /api/chat runs an embedding + graph + LLM call per request, so
# an unthrottled public endpoint is a cost/DoS risk. 20 req/min per IP with a small burst absorbs
# normal use (a person types a few questions a minute) while stopping floods. Zone is 10MB (~160k
# IPs). This is a floor of defense — a real deployment should also add auth / an edge WAF.
limit_req_zone $binary_remote_addr zone=botox_api:10m rate=20r/m;
limit_req_status 429;

# Don't advertise the nginx version.
server_tokens off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers, applied server-wide AND re-included in every location below — nginx does NOT
    # inherit add_header into a location that declares its own, so a location setting Cache-Control
    # would otherwise silently drop these.
    include /etc/nginx/security-headers.conf;

    # Gzip text assets.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Long-cache the hashed build assets; never cache index.html.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # API reverse proxy. The backend service is named "backend" on port 8000 in docker-compose.
    #
    # Resolve the upstream at REQUEST time, not once at startup: nginx normally caches the backend's
    # IP when it boots, so if the backend container is recreated (new IP) nginx keeps proxying to the
    # dead old IP and every /api call 502s until nginx restarts. Using Docker's embedded DNS
    # (127.0.0.11) plus a variable in proxy_pass forces per-request re-resolution, so a backend
    # restart is picked up automatically.
    # The role-gated re-identification endpoint is PRIVILEGED and must NOT be reachable through the
    # public frontend. nginx matches the most specific prefix first, so this block shadows /api/ for
    # /api/support/* and returns 404, hiding it entirely. An internal support tool reaches the reveal
    # endpoint directly on the backend's loopback port (127.0.0.1:8000), never via :8080.
    # Cover BOTH the prefix (/api/support/...) and the exact slash-less form (/api/support), so a
    # request without the trailing slash can't fall through to the /api/ proxy and reach the backend.
    location = /api/support {
        include /etc/nginx/security-headers.conf;
        return 404;
    }
    location /api/support/ {
        include /etc/nginx/security-headers.conf;
        return 404;
    }

    location /api/ {
        include /etc/nginx/security-headers.conf;
        # Throttle per client IP (burst 10 absorbs a quick succession; nodelay serves the burst
        # immediately, then enforces the 20r/m rate). Over the limit → 429, which the widget shows
        # as a temporary-unavailable message.
        limit_req zone=botox_api burst=10 nodelay;

        resolver 127.0.0.11 valid=10s ipv6=off;
        # With a variabled proxy_pass, nginx does NOT do the location-prefix URI rewrite it does for
        # a literal proxy_pass, so we pass the full original request URI explicitly ($request_uri).
        # The backend serves under /api/... so the path passes through unchanged.
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Stream Server-Sent Events (/api/chat/stream) straight through: no response buffering, and
        # no chunked-transfer re-buffering, so tokens reach the browser the moment they're produced.
        proxy_buffering off;
        proxy_cache off;
    }

    # SPA fallback: any non-file route serves index.html.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}

# Security headers, included in every location so nginx's non-inheritance of add_header (any
# location with its own add_header drops the server-level ones) can't silently strip them.
# The app is fully self-contained (no external scripts/styles/images), so a strict CSP is safe.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Operational observability for AMLGuard's batch stages: Pushgateway receives metrics from
# the ingest job, Prometheus scrapes the gateway, Grafana dashboards it. Loopback-bound, in
# keeping with every other sidecar in this project.
services:
  pushgateway:
    image: prom/pushgateway:v1.11.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9091"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9091/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    # Bounded retention so the TSDB does not grow without limit on a long-lived stack.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${AMLGUARD_PROM_RETENTION:-30d}
    ports:
      - "127.0.0.1:9092:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    depends_on:
      - pushgateway
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      # Credentials are env-driven (defaults kept for the loopback-only dev stack). Set
      # GF_ADMIN_USER/GF_ADMIN_PASSWORD in the environment for anything beyond localhost, and
      # set GF_ANON_ENABLED=false to require login.
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-amlguard}
      GF_AUTH_ANONYMOUS_ENABLED: ${GF_ANON_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  prom_data:
  grafana_data:

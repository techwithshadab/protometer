# Operational observability for Protometer's batch stages: Pushgateway receives metrics from
# the ingest job, Prometheus scrapes the gateway, Grafana dashboards it. Loopback-bound, in
# keeping with every other sidecar in this project.
services:
  pushgateway:
    image: prom/pushgateway:v1.11.0
    restart: unless-stopped
    # PERSIST pushed metrics to disk. Without this the gateway is purely in-memory, so a restart
    # (docker restart, host reboot, `compose up` recreate) silently WIPES every ingest metric and
    # the Grafana dashboard goes blank until the next ingest run pushes again. The batch-job pattern
    # means pushes are infrequent, so a lost push is invisible for a long time — persistence is what
    # keeps the operational plane populated between ingest runs.
    # The image runs as `nobody` (uid 65534); a fresh named-volume mount is root-owned, so writing the
    # store there is "permission denied". `user: root` lets the persistence file be created and owned
    # correctly. (Pushgateway holds only operational gauges, no secrets, so running it as root on a
    # loopback-only port is acceptable; the alternative is an init container to chown the volume.)
    user: root
    command:
      - --persistence.file=/data/pushgateway.store
      - --persistence.interval=1m
    volumes:
      - pushgateway_data:/data
    ports:
      - "127.0.0.1:5004:9091"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9091/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    # Bounded retention so the TSDB does not grow without limit on a long-lived stack.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROTOMETER_PROM_RETENTION:-30d}
      # Allow `POST /-/reload` so a scrape-config change (new demo target) applies without a restart.
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:5003:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    depends_on:
      - pushgateway
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:5002:3000"
    environment:
      # Credentials are env-driven (defaults kept for the loopback-only dev stack). Set
      # GF_ADMIN_USER/GF_ADMIN_PASSWORD in the environment for anything beyond localhost, and
      # set GF_ANON_ENABLED=false to require login.
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-protometer}
      GF_AUTH_ANONYMOUS_ENABLED: ${GF_ANON_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  prom_data:
  grafana_data:
  pushgateway_data:

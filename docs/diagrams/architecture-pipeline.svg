<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1074" width="1180" height="1074"><style>text{font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;}</style><rect width="1180" height="1074" fill="#FFFFFF"/><text x="590.0" y="40.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" fill="#1F2937" font-weight="bold" text-anchor="middle">AMLGuard Protected Pipeline, End to End</text><text x="590.0" y="64.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6784" font-weight="normal" text-anchor="middle">Plaintext exists only left of Ingestion and right of Presentation · everything between is tokens</text><rect x="44.0" y="156.0" width="752.0" height="786.0" rx="16" fill="none" stroke="#2F6FDB" stroke-width="1.4" stroke-dasharray="7 6" opacity="1"/><rect x="130.0" y="144.0" width="232.0" height="22.0" rx="8" fill="#DCE7FA" stroke="none" stroke-width="1" opacity="1"/><text x="144.0" y="159.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2F6FDB" font-weight="bold" text-anchor="start">TRUST BOUNDARY · tokens only</text><rect x="60.0" y="96.0" width="720.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#D8DEEC" stroke-width="1.2" opacity="1"/><g transform="translate(72.0,108.0)" fill="none" stroke="#3E9E6B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="9" cy="4.5" rx="6" ry="2.3"/><path d="M3 4.5v9c0 1.3 2.7 2.3 6 2.3s6-1 6-2.3v-9"/><path d="M3 9c0 1.3 2.7 2.3 6 2.3s6-1 6-2.3"/></g><text x="96.0" y="120.5" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3E9E6B" font-weight="600" text-anchor="start">Clear corpus (synthetic; every identifier is generated)</text><text x="100.0" y="130.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6784" font-weight="normal" text-anchor="start">parties · transactions · alerts · ground truth · case narratives</text><line x1="84.0" y1="142.0" x2="84.0" y2="171.0" stroke="#1F2937" stroke-width="1.7"/><polygon points="84.0,179.0 80.1,170.9 87.9,170.9" fill="#1F2937"/><rect x="60.0" y="186.0" width="720.0" height="76.0" rx="12" fill="#EAF3EC" stroke="#CFE6D6" stroke-width="1.3" opacity="1"/><circle cx="84.0" cy="210.0" r="11" fill="#2F6FDB"/><text x="84.0" y="214.2" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.55" fill="#fff" font-weight="bold" text-anchor="middle">1</text><g transform="translate(104.0,201.0)" fill="none" stroke="#3E9E6B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5"/><path d="M12 12l4 4"/></g><text x="130.0" y="213.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#3E9E6B" font-weight="bold" text-anchor="start">Ingestion</text><text x="130.0" y="232.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6784" font-weight="normal" text-anchor="start">Data Discovery classifies each narrative; a roster fills its measured gaps; entities batched by data element,</text><text x="130.0" y="246.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6784" font-weight="normal" text-anchor="start">then Protegrity /protect. No-op tokens redacted, leak-verified.</text><line x1="84.0" y1="266.0" x2="84.0" y2="281.0" stroke="#1F2937" stroke-width="1.7"/><polygon points="84.0,289.0 80.1,280.9 87.9,280.9" fill="#1F2937"/><text x="102.0" y="282.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6784" font-weight="normal" text-anchor="start">protected corpus · one copy per scope (8 scopes)</text><rect x="60.0" y="296.0" width="720.0" height="76.0" rx="12" fill="#E8F0FB" stroke="#CFE0F5" stroke-width="1.3" opacity="1"/><circle cx="84.0" cy="320.0" r="11" fill="#2F6FDB"/><text x="84.0" y="324.2" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.55" fill="#fff" font-weight="bold" text-anchor="middle">2</text><g transform="translate(104.0,311.0)" fill="none" stroke="#3D74C9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15V3M3 15h12M6 12v-3M9.5 12V7M13 12V5"/></g><text x="130.0" y="323.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#3D74C9" font-weight="bold" text-anchor="start">Training</text><text x="130.0" y="342.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6784" font-weight="normal" text-anchor="start">RandomForest + graph features, fitted PER SCOPE on the protected ledger; SHAP reliance; logged to the MLflow</text><text x="130.0" y="356.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6784" font-weight="normal" text-anchor="start">registry.</text><line x1="84.0" y1="376.0" x2="84.0" y2="391.0" stroke="#1F2937" stroke-width="1.7"/><polygon points="84.0,399.0 80.1,390.9 87.9,390.9" fill="#1F2937"/><rect x="60.0" y="406.0" width="720.0" height="76.0" rx="12" fill="#E7F4F5" stroke="#C7E8EC" stroke-width="1.3" opacity="1"/><circle cx="84.0" cy="430.0" r="11" fill="#2F6FDB"/><text x="84.0" y="434.2" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.55" fill="#fff" font-weight="bold" text-anchor="middle">3</text><g transform="translate(104.0,421.0)" fill="none" stroke="#2FB6C4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2l7 3.5-7 3.5-7-3.5zM2 9l7 3.5L16 9M2 12.5L9 16l7-3.5"/></g><text x="130.0" y="433.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#2FB6C4" font-weight="bold" text-anchor="start">Embedding</text><text x="130.0" y="452.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6784" font-weight="normal" text-anchor="start">Local MiniLM vectors over the protected narratives into a ChromaDB index (tokens only, no plaintext embedded).</text><line x1="84.0" y1="486.0" x2="84.0" y2="501.0" stroke="#1F2937" stroke-width="1.7"/><polygon points="84.0,509.0 80.1,500.9 87.9,500.9" fill="#1F2937"/><rect x="60.0" y="516.0" width="720.0" height="76.0" rx="12" fill="#E7F4F5" stroke="#C7E8EC" stroke-width="1.3" opacity="1"/><circle cx="84.0" cy="540.0" r="11" fill="#2F6FDB"/><text x="84.0" y="544.2" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.55" fill="#fff" font-weight="bold" text-anchor="middle">4</text><g transform="translate(104.0,531.0)" fill="none" stroke="#2FB6C4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="4" r="2"/><circle cx="14" cy="14" r="2"/><path d="M6 4h5a3 3 0 013 3v5"/></g><text x="130.0" y="543.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#2FB6C4" font-weight="bold" text-anchor="start">Retrieval</text><text x="130.0" y="562.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6784" font-weight="normal" text-anchor="start">A case opens on a surrogate key; a 2-hop transaction network + top-k token chunks form the prompt.</text><line x1="84.0" y1="596.0" x2="84.0" y2="611.0" stroke="#1F2937" stroke-width="1.7"/><polygon points="84.0,619.0 80.1,610.9 87.9,610.9" fill="#1F2937"/><text x="102.0" y="612.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6784" font-weight="normal" text-anchor="start">prompt = tokens + computed candidates</text><rect x="60.0" y="626.0" width="720.0" height="80.0" rx="12" fill="#EFEAF7" stroke="#DED3EF" stroke-width="1.3" opacity="1"/><circle cx="84.0" cy="650.0" r="11" fill="#2F6FDB"/><text x="84.0" y="654.2" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.55" fill="#fff" font-weight="bold" text-anchor="middle">5</text><g transform="translate(104.0,641.0)" fill="none" stroke="#7A5AB6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3a3 3 0 00-3 3 3 3 0 00-1 5 3 3 0 003 4 3 3 0 001 0V3zM11 3a3 3 0 013 3 3 3 0 011 5 3 3 0 01-3 4 3 3 0 01-1 0V3z"/></g><text x="130.0" y="653.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#7A5AB6" font-weight="bold" text-anchor="start">Inference</text><text x="130.0" y="672.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6784" font-weight="normal" text-anchor="start">Model reasons over tokens: hosted (Bedrock/Claude) when credentials are present, else a local open-source</text><text x="130.0" y="686.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6784" font-weight="normal" text-anchor="start">model (Ollama). Temp 0, cached, spend-capped, every call traced.</text><line x1="84.0" y1="710.0" x2="84.0" y2="725.0" stroke="#1F2937" stroke-width="1.7"/><polygon points="84.0,733.0 80.1,724.9 87.9,724.9" fill="#1F2937"/><rect x="60.0" y="740.0" width="720.0" height="76.0" rx="12" fill="#FBECEC" stroke="#F2D6D6" stroke-width="1.3" opacity="1"/><circle cx="84.0" cy="764.0" r="11" fill="#2F6FDB"/><text x="84.0" y="768.2" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.55" fill="#fff" font-weight="bold" text-anchor="middle">6</text><g transform="translate(104.0,755.0)" fill="none" stroke="#D25C5C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2l6 2.4v4c0 4-2.7 6.4-6 7.6-3.3-1.2-6-3.6-6-7.6v-4z"/></g><text x="130.0" y="767.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#D25C5C" font-weight="bold" text-anchor="start">Egress</text><text x="130.0" y="786.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6784" font-weight="normal" text-anchor="start">Semantic Guardrail scan + forbidden-value leak check + groundedness gate. Fail-closed on the analyst path.</text><line x1="84.0" y1="820.0" x2="84.0" y2="835.0" stroke="#1F2937" stroke-width="1.7"/><polygon points="84.0,843.0 80.1,834.9 87.9,834.9" fill="#1F2937"/><rect x="60.0" y="850.0" width="720.0" height="76.0" rx="12" fill="#EAF3EC" stroke="#CFE6D6" stroke-width="1.3" opacity="1"/><circle cx="84.0" cy="874.0" r="11" fill="#2F6FDB"/><text x="84.0" y="878.2" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.55" fill="#fff" font-weight="bold" text-anchor="middle">7</text><g transform="translate(104.0,865.0)" fill="none" stroke="#3E9E6B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="6" r="3"/><path d="M3.5 16a5.5 5.5 0 0111 0"/></g><text x="130.0" y="877.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#3E9E6B" font-weight="bold" text-anchor="start">Presentation</text><text x="130.0" y="896.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6784" font-weight="normal" text-anchor="start">Role-gated /unprotect. Auditor: nothing · Analyst: structure · Investigator: everything.</text><line x1="84.0" y1="930.0" x2="84.0" y2="951.0" stroke="#1F2937" stroke-width="1.7"/><polygon points="84.0,959.0 80.1,950.9 87.9,950.9" fill="#1F2937"/><rect x="60.0" y="966.0" width="720.0" height="40.0" rx="10" fill="#FFFFFF" stroke="#D8DEEC" stroke-width="1.2" opacity="1"/><g transform="translate(72.0,978.0)" fill="none" stroke="#3E9E6B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 9S4 4 9 4s7.5 5 7.5 5-2.5 5-7.5 5S1.5 9 1.5 9z"/><circle cx="9" cy="9" r="2.2"/></g><text x="96.0" y="990.5" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3E9E6B" font-weight="600" text-anchor="start">Analyst screen: the only plaintext surface</text><rect x="820.0" y="150.0" width="320.0" height="198.0" rx="14" fill="#FBECEC" stroke="#F2D6D6" stroke-width="1.4" opacity="1"/><text x="840.0" y="175.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#D25C5C" font-weight="bold" text-anchor="start">Observability</text><text x="840.0" y="190.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6784" font-weight="normal" text-anchor="start" font-style="italic">loopback-only, optional</text><g transform="translate(838.0,202.0)" fill="none" stroke="#D25C5C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15V3M3 15h12M6 12v-3M9.5 12V7M13 12V5"/></g><text x="864.0" y="210.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#1F2937" font-weight="600" text-anchor="start">MLflow</text><text x="864.0" y="224.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6784" font-weight="normal" text-anchor="start">Experiment ledger + model registry: runs, params,</text><text x="864.0" y="236.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6784" font-weight="normal" text-anchor="start">metrics, signatures.</text><g transform="translate(838.0,246.0)" fill="none" stroke="#D25C5C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 9S4 4 9 4s7.5 5 7.5 5-2.5 5-7.5 5S1.5 9 1.5 9z"/><circle cx="9" cy="9" r="2.2"/></g><text x="864.0" y="254.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#1F2937" font-weight="600" text-anchor="start">Langfuse</text><text x="864.0" y="268.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6784" font-weight="normal" text-anchor="start">Per-generation record: prompt, completion, tokens,</text><text x="864.0" y="280.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6784" font-weight="normal" text-anchor="start">cost, latency, scores.</text><g transform="translate(838.0,290.0)" fill="none" stroke="#D25C5C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3a4 4 0 014 4c0 4 2 5 2 5H3s2-1 2-5a4 4 0 014-4zM7.5 15a1.6 1.6 0 003 0"/></g><text x="864.0" y="298.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#1F2937" font-weight="600" text-anchor="start">Prometheus + Grafana</text><text x="864.0" y="312.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6784" font-weight="normal" text-anchor="start">Ingest ops as a time-series; PII scrubbed before</text><text x="864.0" y="324.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6784" font-weight="normal" text-anchor="start">storage.</text><rect x="820.0" y="376.0" width="320.0" height="184.0" rx="14" fill="#EEF1F6" stroke="#DBE1EC" stroke-width="1.4" opacity="1"/><text x="840.0" y="401.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#5A6784" font-weight="bold" text-anchor="start">Cross-cutting</text><g transform="translate(838.0,414.0)" fill="none" stroke="#5A6784" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="9" r="3"/><path d="M9 9h7M14 9v3M16 9v2"/></g><text x="864.0" y="422.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#1F2937" font-weight="600" text-anchor="start">Key rotation</text><text x="864.0" y="436.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6784" font-weight="normal" text-anchor="start">/reprotect migrates tokens server-side; plaintext</text><text x="864.0" y="448.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6784" font-weight="normal" text-anchor="start">never transits the app.</text><g transform="translate(838.0,458.0)" fill="none" stroke="#5A6784" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="9" cy="4.5" rx="6" ry="2.3"/><path d="M3 4.5v9c0 1.3 2.7 2.3 6 2.3s6-1 6-2.3v-9"/><path d="M3 9c0 1.3 2.7 2.3 6 2.3s6-1 6-2.3"/></g><text x="864.0" y="466.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#1F2937" font-weight="600" text-anchor="start">Postgres</text><text x="864.0" y="480.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6784" font-weight="normal" text-anchor="start">The app&#x27;s queryable source of truth (corpus</text><text x="864.0" y="492.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6784" font-weight="normal" text-anchor="start">mirror).</text><g transform="translate(838.0,502.0)" fill="none" stroke="#5A6784" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="10" height="7" rx="1.5"/><path d="M6 8V6a3 3 0 016 0v2"/></g><text x="864.0" y="510.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#1F2937" font-weight="600" text-anchor="start">Spend + auth rails</text><text x="864.0" y="524.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6784" font-weight="normal" text-anchor="start">Pre-call spend cap; shared-secret + turn ceiling</text><text x="864.0" y="536.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6784" font-weight="normal" text-anchor="start">on billed endpoints.</text><line x1="800.0" y1="234.0" x2="810.0" y2="234.0" stroke="#1F2937" stroke-width="1.7" stroke-dasharray="5 4"/><polygon points="818.0,234.0 809.9,237.9 809.9,230.1" fill="#1F2937"/><text x="820.0" y="632.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6784" font-weight="normal" text-anchor="start" font-style="italic">Every stage feeds observability (async).</text><text x="60.0" y="1044.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#5A6784" font-weight="600" text-anchor="start">Flow:</text><line x1="110.0" y1="1040.0" x2="142.0" y2="1040.0" stroke="#1F2937" stroke-width="1.7"/><polygon points="150.0,1040.0 141.9,1043.9 141.9,1036.1" fill="#1F2937"/><text x="158.0" y="1044.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6784" font-weight="normal" text-anchor="start">Sync / data flow</text><line x1="300.0" y1="1040.0" x2="332.0" y2="1040.0" stroke="#1F2937" stroke-width="1.7" stroke-dasharray="5 4"/><polygon points="340.0,1040.0 331.9,1043.9 331.9,1036.1" fill="#1F2937"/><text x="348.0" y="1044.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6784" font-weight="normal" text-anchor="start">Async / event flow</text></svg>
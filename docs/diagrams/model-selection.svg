<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570"><style>text{font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;}</style><rect width="1000" height="570" fill="#FFFFFF"/><text x="500.0" y="38.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" fill="#1F2937" font-weight="bold" text-anchor="middle">Live-Chat Model Selection</text><text x="500.0" y="61.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6784" font-weight="normal" text-anchor="middle">The UI picks a model per request, so the demo runs with or without a cloud account</text><rect x="20.0" y="145.0" width="140.0" height="40.0" rx="20" fill="#FFFFFF" stroke="#D8DEEC" stroke-width="1.3" opacity="1"/><g transform="translate(32.0,156.0)" fill="none" stroke="#2F6FDB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h12v8H8l-3 3v-3H3z"/></g><text x="60.0" y="169.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1F2937" font-weight="600" text-anchor="start">Live turn</text><line x1="160.0" y1="165.0" x2="227.0" y2="165.0" stroke="#1F2937" stroke-width="1.7"/><polygon points="235.0,165.0 226.9,168.9 226.9,161.1" fill="#1F2937"/><path d="M320.0,120.0 L405.0,165.0 L320.0,210.0 L235.0,165.0 Z" fill="#DCE7FA" stroke="#2F6FDB" stroke-width="1.4"/><text x="320.0" y="169.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2937" font-weight="600" text-anchor="middle">AMLGUARD_UI_MODEL set?</text><line x1="405.0" y1="165.0" x2="552.0" y2="165.0" stroke="#1F2937" stroke-width="1.7"/><polygon points="560.0,165.0 551.9,168.9 551.9,161.1" fill="#1F2937"/><text x="417.0" y="157.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10" fill="#2F6FDB" font-weight="600" text-anchor="start">yes</text><rect x="560.0" y="123.0" width="380.0" height="84.0" rx="10" fill="#EFEAF7" stroke="#DED3EF" stroke-width="1.4" opacity="1"/><g transform="translate(576.0,138.0)" fill="none" stroke="#7A5AB6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h9M6 9h9M6 14h9M3 4h.01M3 9h.01M3 14h.01"/></g><text x="602.0" y="150.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7A5AB6" font-weight="bold" text-anchor="start">Use the named model (explicit override)</text><text x="576.0" y="169.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6784" font-weight="normal" text-anchor="start">AMLGUARD_UI_MODEL wins unconditionally · validated against</text><text x="576.0" y="182.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6784" font-weight="normal" text-anchor="start">config/models.yaml</text><line x1="320.0" y1="210.0" x2="320.0" y2="277.0" stroke="#1F2937" stroke-width="1.7"/><polygon points="320.0,285.0 316.1,276.9 323.9,276.9" fill="#1F2937"/><text x="330.0" y="250.5" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6784" font-weight="600" text-anchor="start">no</text><path d="M320.0,285.0 L405.0,330.0 L320.0,375.0 L235.0,330.0 Z" fill="#DCE7FA" stroke="#2F6FDB" stroke-width="1.4"/><text x="320.0" y="334.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1F2937" font-weight="600" text-anchor="middle">AWS credentials present?</text><line x1="405.0" y1="330.0" x2="552.0" y2="330.0" stroke="#1F2937" stroke-width="1.7"/><polygon points="560.0,330.0 551.9,333.9 551.9,326.1" fill="#1F2937"/><text x="417.0" y="322.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10" fill="#2F6FDB" font-weight="600" text-anchor="start">yes</text><rect x="560.0" y="288.0" width="380.0" height="84.0" rx="10" fill="#E8F0FB" stroke="#CFE0F5" stroke-width="1.4" opacity="1"/><g transform="translate(576.0,303.0)" fill="none" stroke="#3D74C9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13a3 3 0 010-6 4 4 0 017.7-1A3.2 3.2 0 0114 13z"/></g><text x="602.0" y="315.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3D74C9" font-weight="bold" text-anchor="start">Hosted model: bedrock-sonnet-5</text><text x="576.0" y="334.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6784" font-weight="normal" text-anchor="start">Matches the committed evaluation artifacts · a real billed call</text><path d="M320.0,375.0 L320.0,450.0 L552.0,450.0" fill="none" stroke="#1F2937" stroke-width="1.7"/><polygon points="560.0,450.0 551.9,453.9 551.9,446.1" fill="#1F2937"/><text x="330.0" y="392.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6784" font-weight="600" text-anchor="start">no</text><rect x="560.0" y="408.0" width="380.0" height="84.0" rx="10" fill="#E7F4F5" stroke="#C7E8EC" stroke-width="1.4" opacity="1"/><g transform="translate(576.0,423.0)" fill="none" stroke="#2FB6C4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="8" height="8" rx="1.5"/><path d="M8 2v3M10 2v3M8 13v3M10 13v3M2 8h3M2 10h3M13 8h3M13 10h3"/></g><text x="602.0" y="435.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2FB6C4" font-weight="bold" text-anchor="start">Local open-source model: llama3.2 (Ollama)</text><text x="576.0" y="454.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6784" font-weight="normal" text-anchor="start">No cloud account · $0 per turn · make setup-local-model /</text><text x="576.0" y="467.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6784" font-weight="normal" text-anchor="start">auto-pull</text><rect x="90.0" y="508.0" width="850.0" height="50.0" rx="10" fill="#EAF3EC" stroke="#CFE6D6" stroke-width="1.3" opacity="1"/><g transform="translate(106.0,524.0)" fill="none" stroke="#3E9E6B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2l6 2.4v4c0 4-2.7 6.4-6 7.6-3.3-1.2-6-3.6-6-7.6v-4z"/></g><text x="132.0" y="530.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#3E9E6B" font-weight="bold" text-anchor="start">Tokenization is always Protegrity.</text><text x="330.0" y="530.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6784" font-weight="normal" text-anchor="start">Only the reasoning model changes; the protected pipeline is identical either way.</text><text x="132.0" y="548.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6784" font-weight="normal" text-anchor="start">GET /api/health reports the resolved model, its provider, and whether it is ready.</text></svg>
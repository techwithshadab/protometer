[project]
name = "amlguard"
version = "1.0.0"
description = "AML investigation copilot measuring what Protegrity tokenization costs an AI pipeline"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
# Runtime pins live in requirements.txt (the judged install path); this package
# declaration exists for editable installs and tooling.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
  "E501",  # long lines carry measured prose; the docstrings are the documentation
  "E402",  # scripts bootstrap sys.path before imports by design
  "B008",
  "B905",  # zips are same-length by construction throughout
  "E701", "E702",  # compact one-liners in script bootstraps
]

[tool.pytest.ini_options]
testpaths = ["tests"]
